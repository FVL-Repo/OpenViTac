policy_name: openpi
seed: 0
instruction_type: seen
instuction_file: null
eval_from_start: true
eval_step_timeout_seconds: 10
eval_action_repeat: 1

openpi:
  host: "127.0.0.1"
  port: 8008
  api_key:
  websocket_ping_interval:
  websocket_ping_timeout:
  websocket_open_timeout: 10
  websocket_close_timeout: 10
  prompt: "Pick up the red gear, assemble it onto the base, and rotate it to turn the gear pair."
  prompt_from_task_instruction: true

  # Use this only when the server returns raw relative-joint actions:
  #   action[:7] = target_joint[:7] - observation/state[:7]
  #   action[7]  = absolute gripper qpos
  # This is not adjacent-frame delta. The client converts each received chunk to
  # absolute qpos8 using the observation/state from that same inference request.
  control_mode: "relative_joint"
  state_dim: 8
  action_dim: 8
  max_joint_delta:

  image_size: 224
  send_tactile: false
  image_color_order: "rgb"
  debug_dump_first_n_obs: 1
  debug_dump_dir: "debug/openpi_obs_turn_gear_pair_relative_joint_vision"

  open_loop_horizon: 5
  temporal_ensemble: true
  chunk_first_n: 20
  ensemble_K: 0.01
