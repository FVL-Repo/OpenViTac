[project]
name = "openvitac-sim"
version = "0.0.0"
description = "OpenViTac Simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab==3.0.0rc1",
    "isaacsim[all]==6.1.0.0",
    "openvitac-spec",
    "openvitac-tactile",
    "torch",
    "torchvision",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openvitac_sim"
