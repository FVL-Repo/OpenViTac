[project]
name = "openvitac-tactile"
version = "0.0.0"
description = "OpenViTac tactile runtime (process-isolated UIPC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyuipc==0.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
[project.optional-dependencies]
uipc = ["pyuipc==0.0.29"]
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-name = "openvitac_tactile"
