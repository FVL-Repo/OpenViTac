[project]
name = "openvitac-tasks"
version = "0.0.0"
description = "OpenViTac prefabricated tasks"
requires-python = ">=3.12,<3.13"
dependencies = ["openvitac-spec"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openvitac_tasks"
